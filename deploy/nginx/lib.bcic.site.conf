limit_req_zone $binary_remote_addr zone=smartlib_auth:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name lib.bcic.site;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name lib.bcic.site;

  ssl_certificate /etc/letsencrypt/live/lib.bcic.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lib.bcic.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SmartLibTLS:10m;
  ssl_session_tickets off;

  client_max_body_size 6m;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=smartlib_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
