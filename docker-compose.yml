services:
  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: 1
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - smartlib-data:/app/data
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_API_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SMARTLIB_PORT:-8080}:80"
    restart: unless-stopped
volumes:
  smartlib-data:
